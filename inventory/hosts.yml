---
# Declaration like networks:
# - External -> Devices outside control
# - DMZ -> Exposed infra
# - Trusted -> Middlewares (devices / infra that do not store or process info)
# - Restricted -> Devices / infra that processes info
# - Management -> Security + Network management
#
# Zone groups say WHERE a host lives
# Role groups say WHAT a host does
all:
  children:

    # ---- Zones ---- #
    external:
      hosts:
        vagrant-kali-1:
          ansible_host: 192.168.10.1

    dmz:
      hosts:
        vagrant-ubuntu-1:
          ansible_host: 192.168.20.1

        vagrant-ubuntu-2:
          ansible_host: 192.168.20.2

        vagrant-ubuntu-3:
          ansible_host: 192.168.20.3

    trusted:
      hosts:
        vagrant-redhat-1:
          ansible_host: 192.168.30.1

        vagrant-redhat-2:
          ansible_host: 192.168.30.2

        vagrant-redhat-3:
          ansible_host: 192.168.30.3

        vagrant-keycloak-1:
          ansible_host: 192.168.30.4

    restricted:
      hosts:
        vagrant-postgresql-1:
          ansible_host: 192.168.40.1

        vagrant-postgresql-2:
          ansible_host: 192.168.40.2

    management:
      hosts:
        vagrant-manager-1:
          ansible_host: 192.168.50.1

    # ---- Role ---- #
    proxychains-hosts:
      hosts:
        vagrant-kali-1:
    reverse-proxy-hosts:
      hosts:
        vagrant-ubuntu-1:
        vagrant-ubuntu-2:
    keycloak-hosts:
      hosts:
        vagrant-keycloak-1:
    postgresql-hosts:
      hosts:
        vagrant-postgresql-1:
        vagrant-postgresql-2:
