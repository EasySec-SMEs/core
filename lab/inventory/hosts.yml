---
# Declaration like networks:
# - DMZ -> Exposed infra
# - Trusted -> Middlewares (devices / infra that do not store or process info)
# - Restricted -> Devices / infra that processes info
# - Management -> Security + Network management
#
# Zone groups say WHERE a host lives
# Role groups say WHAT a host does
# All hosts have access to the management network (to be configured)
all:
  children:
    # ---- Zones ---- #
    dmz:
      hosts:
        vagrant-ubuntu-1:
          public_ip: 192.168.20.10
          management_ip: 192.168.50.10

        vagrant-ubuntu-2:
          public_ip: 192.168.20.20
          management_ip: 192.168.50.11

        vagrant-ubuntu-3:
          public_ip: 192.168.20.30
          management_ip: 192.168.50.12

    trusted:
      hosts:
        vagrant-rocky-1:
          public_ip: 192.168.30.10
          management_ip: 192.168.50.13

        vagrant-rocky-2:
          public_ip: 192.168.30.20
          management_ip: 192.168.50.14

        vagrant-rocky-3:
          public_ip: 192.168.30.30
          management_ip: 192.168.50.15

        vagrant-kali-1:
          public_ip: 192.168.30.40
          management_ip: 192.168.50.16

    restricted:
      hosts:
        vagrant-postgresql-1:
          public_ip: 192.168.40.10
          management_ip: 192.168.50.17

        vagrant-postgresql-2:
          public_ip: 192.168.40.20
          management_ip: 192.168.50.18

        vagrant-keycloak-1:
          public_ip: 192.168.40.30
          management_ip: 192.168.50.19

    management:
      hosts:
        vagrant-manager-1:
          public_ip: 192.168.50.254
          management_ip: 192.168.50.254

    # ---- Role ---- #
    proxychains:
      hosts:
        vagrant-kali-1:
    reverse_proxy:
      hosts:
        vagrant-ubuntu-1:
        vagrant-ubuntu-2:
    keycloak:
      hosts:
        vagrant-keycloak-1:
    keycloak_db:
      hosts:
        vagrant-postgresql-2:
    postgresql:
      hosts:
        vagrant-postgresql-1:
        vagrant-postgresql-2:
