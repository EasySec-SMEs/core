---
# Variables used by all roles
general_group: anchore
general_user: anchore
general_config_folder: /etc/anchore
general_log_folder: /var/log/anchore

# Syft env variables
syft_group: "{{ general_group }}"
syft_user: "{{ general_user }}"
syft_time: {} # No execution of cronjob
syft_config_folder: "{{ general_config_folder }}"
syft_log_folder: "{{ general_log_folder }}"

# Grype env variables
grype_group: "{{ general_group }}"
grype_user: "{{ general_user }}"
grype_time: {} # No execution of cronjob
grype_config_folder: "{{ general_config_folder }}"
grype_log_folder: "{{ general_log_folder }}"

# Grant role joins all workflows
grant_group: "{{ general_group }}"
grant_user: "{{ general_user }}"
grant_time:
  weekday: "0"
  hour: "3"
  minute: "0"
grant_config_folder: "{{ general_config_folder }}"
grant_log_folder: "{{ general_log_folder }}"
grant_job_title: "Anchore workflow - EasySec"
grant_job: >-  # Same job for all workflows
  {{ syft_binary_path }} -c {{ syft_custom_config_path }} / -o json > {{ syft_log_folder }}/audit-sbom.json 2>&1 &&
  {{ grype_binary_path }} -c {{ grype_custom_config_path }} sbom:{{ syft_log_folder }}/audit-sbom.json >> {{ grype_log_path }} 2>&1 &&
  {{ grant_binary_path }} -c {{ grant_custom_config_path }} check {{ syft_log_folder }}/audit-sbom.json >> {{ grant_log_path }} 2>&1
